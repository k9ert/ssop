name: Agent Docker Build & Test

on:
  push:
    paths:
      - 'docker/**'
      - 'cloud-init/**'
    branches: [main]
  pull_request:
    paths:
      - 'docker/**'
      - 'cloud-init/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ssop-agent

jobs:
  # --- Bootstrap unit tests (no secrets needed) ---
  test-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bootstrap.sh unit tests
        run: ./cloud-init/test_bootstrap.sh

  # --- Docker build and E2E test ---
  build-and-test:
    runs-on: ubuntu-latest
    needs: test-bootstrap
    env:
      HAS_PPQ_KEY: ${{ secrets.PPQ_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          push: false
          tags: ssop-agent:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # --- E2E Test ---
      - name: Setup Node.js for tests
        if: env.HAS_PPQ_KEY == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install test dependencies
        if: env.HAS_PPQ_KEY == 'true'
        run: npm install --no-save ws nostr-tools

      - name: Run E2E test
        if: env.HAS_PPQ_KEY == 'true'
        timeout-minutes: 5
        run: |
          chmod +x docker/test/run_e2e.sh
          docker/test/run_e2e.sh ssop-agent:test "${{ secrets.PPQ_API_KEY }}"

      - name: Skip notice (no PPQ key)
        if: env.HAS_PPQ_KEY != 'true'
        run: echo "⚠️ PPQ_API_KEY not set — skipping agent E2E test. Build-only."
