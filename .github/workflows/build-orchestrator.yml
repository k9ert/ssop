name: Build Orchestrator

on:
  push:
    paths:
      - 'orchestrator/**'
    branches: [main]
  pull_request:
    paths:
      - 'orchestrator/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        working-directory: orchestrator
        run: go mod tidy

      - name: Build linux/amd64
        working-directory: orchestrator
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
        run: go build -trimpath -o ssop-orchestrator-linux-amd64 .

      - uses: actions/upload-artifact@v4
        with:
          name: ssop-orchestrator-linux-amd64
          path: orchestrator/ssop-orchestrator-linux-amd64

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orchestrator-latest
          name: "Orchestrator (latest main)"
          body: |
            Auto-built from main branch.
            Commit: ${{ github.sha }}
          prerelease: true
          files: artifacts/**/*
          make_latest: false

  deploy:
    needs: release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
    steps:
      - name: Deploy to server
        if: env.HAS_DEPLOY_KEY == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "Downloading latest orchestrator binary..."
            curl -sL -o /tmp/ssop-orchestrator \
              https://github.com/k9ert/ssop/releases/download/orchestrator-latest/ssop-orchestrator-linux-amd64
            chmod +x /tmp/ssop-orchestrator
            echo "Stopping service..."
            sudo systemctl stop ssop-orchestrator || true
            mv /tmp/ssop-orchestrator /opt/ssop/orchestrator/ssop-orchestrator
            echo "Starting service..."
            sudo systemctl start ssop-orchestrator
            sleep 5
            sudo systemctl is-active ssop-orchestrator
            echo "Deploy complete ✅"
